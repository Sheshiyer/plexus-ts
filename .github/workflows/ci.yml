name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Verify documentation consistency
        run: npm run verify:docs

      - name: Test documentation drift checks
        run: npm run test:docs

      - name: Test release operations
        run: npm run test:release-ops

      - name: Lint
        run: npm run lint

      - name: No-placeholder scan
        run: npm run release:scan-placeholders

      - name: Verify Electron fuse policy
        run: npm run verify:fuses

      - name: Production dependency audit
        run: npm run security:audit:prod

      - name: Release-chain dependency audit
        run: npm run security:audit:release

      - name: Verify renderer CSP
        run: npm run verify:csp

      - name: Verify release evidence policy
        run: npm run verify:release-evidence

      - name: Verify release candidate closeout
        run: npm run verify:release-candidate

      - name: Test assistant
        run: npm run test:assistant
        timeout-minutes: 10

      - name: Test coworking
        run: npm run test:coworking
        timeout-minutes: 10

      - name: Test identity
        run: npm run test:identity
        timeout-minutes: 10

      - name: Test renderer
        run: npm run test:renderer
        timeout-minutes: 10

      - name: Build main
        run: npm run build:main

      - name: Build preload
        run: npm run build:preload

      - name: Build renderer
        run: npm run build:renderer

      - name: Type check
        run: npm run typecheck

      - name: Smoke all
        env:
          PLEXUS_OMNIROUTE_RELAY_ORIGIN: ${{ vars.PLEXUS_OMNIROUTE_RELAY_ORIGIN }}
        run: npm run smoke:all
